  <path d="M0 262 C 70 222, 140 238, 200 252 S 330 222, 400 240 L400 400 L0 400 Z" fill="#A9C27A"/>
  <path d="M0 286 C 90 258, 170 276, 250 270 S 360 256, 400 266 L400 400 L0 400 Z" fill="#7FA556"/>

