    <path d="M352 256 l3 -24 l3 24 z"/><path d="M355 236 c -13 -6 -20 -2 -26 6 c 11 0 19 -2 26 -6 z"/><path d="M355 236 c 13 -6 20 -2 26 6 c -11 0 -19 -2 -26 -6 z"/>
  </g>

