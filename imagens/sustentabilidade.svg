    <path d="M150 346 c 8 -12 20 -14 28 -8 c -10 0 -20 4 -28 8 z" fill="#F2B52A" stroke="#B9780F" stroke-width="1"/>
    <rect x="124" y="342" width="64" height="7" rx="3.5" fill="#C48A4A"/>
