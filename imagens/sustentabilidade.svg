<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBD46A"/>
      <stop offset="0.6" stop-color="#F7E3A6"/>
      <stop offset="1" stop-color="#EAD9A0"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8E9"/>
      <stop offset="0.6" stop-color="#FFE7A8"/>
      <stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FA84B"/>
      <stop offset="1" stop-color="#395424"/>
    </linearGradient>
    <linearGradient id="folha2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DB556"/>
      <stop offset="1" stop-color="#4C7031"/>
    </linearGradient>
    <linearGradient id="tronco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8B3D"/>
      <stop offset="0.5" stop-color="#8FA552"/>
      <stop offset="1" stop-color="#5E7A33"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5030"/>
      <stop offset="1" stop-color="#4A2E17"/>
    </linearGradient>
  </defs>

  <!-- céu e sol -->
  <rect width="400" height="400" fill="url(#ceu)"/>
  <circle cx="300" cy="96" r="78" fill="url(#sol)"/>
  <circle cx="300" cy="96" r="34" fill="#FFF8E9"/>

