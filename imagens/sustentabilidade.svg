  <path d="M206 183 C 252 166, 310 160, 352 158" stroke="#D9E8B8" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M300 160 l 6 12 M272 164 l 4 12 M326 158 l 8 10" stroke="#F7E3A6" stroke-width="2" opacity="0.8"/>

