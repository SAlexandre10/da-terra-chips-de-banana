    <path d="M130 352 L 182 352 M132 362 L 180 362 M134 371 L 178 371" stroke="#8A5A28" stroke-width="2"/>
    <path d="M144 346 L 146 378 M156 346 L 156 378 M168 346 L 166 378" stroke="#8A5A28" stroke-width="1.5" opacity="0.7"/>
