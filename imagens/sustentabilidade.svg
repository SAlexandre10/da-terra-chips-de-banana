  <path d="M0 362 C 130 346, 270 346, 400 362" stroke="#3A2210" stroke-width="3" fill="none" opacity="0.4"/>

  <g>
    <path d="M86 326 l 0 -18" stroke="#4C7031" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 312 c -10 -8 -18 -4 -20 2 c 8 2 14 2 20 -2 z" fill="#6FA84B"/>
    <path d="M86 310 c 10 -8 18 -4 20 2 c -8 2 -14 2 -20 -2 z" fill="#6FA84B"/>
  </g>
  <g>
    <path d="M318 326 l 0 -16" stroke="#4C7031" stroke-width="3" stroke-linecap="round"/>
    <path d="M318 312 c -9 -7 -16 -4 -18 2 c 7 2 12 2 18 -2 z" fill="#6FA84B"/>
    <path d="M318 310 c 9 -7 16 -4 18 2 c -7 2 -12 2 -18 -2 z" fill="#6FA84B"/>
  </g>

  <!-- cesto com bananas colhidas -->
  <g>
